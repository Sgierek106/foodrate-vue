services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodrate-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - db-data:/app/data
    networks:
      - foodrate

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodrate-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - foodrate

volumes:
  db-data:

networks:
  foodrate:
    driver: bridge
